  /* ---------- the box ---------- */
  .tin { position: relative; width: min(560px, 100%); height: 540px; touch-action: pan-y; user-select: none; }
  .wall {
    position: absolute; left: 0; right: 0; top: 20px; bottom: 0;
    background: var(--wood-dark); border-radius: 14px 14px 0 0;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.25);
  }
  .cards { position: absolute; inset: 0; perspective: 1200px; }

  .card {
    --c: var(--paper);
    position: absolute; left: 4%; right: 4%;
    top: calc(190px - var(--k, 0) * 38px);
    height: 340px;
    transition: top .38s cubic-bezier(.3,.8,.3,1), opacity .3s;
  }
  .card[data-pos="behind"] { --c: var(--paper-back); }
  .card[data-pos="hidden"] { opacity: 0; pointer-events: none; }

  .tab {              /* index tab that sticks up above the card */
    position: absolute; top: -28px; left: var(--tabx, 4%); width: 32%; height: 28px;
    border: 0; margin: 0; padding: 0 10px;
    background: var(--c); color: var(--ink);
    border-radius: 6px 6px 0 0;
    box-shadow: 0 -1px 2px rgba(0,0,0,.2);
    font: 0.85rem/30px var(--type); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .card[data-pos="front"] .tab { cursor: default; pointer-events: none; }
  .card[data-pos="behind"] .tab:hover { background: #fff0c4; }
  .tab:focus-visible, .face:focus-visible { outline: 3px solid #1f5fbf; outline-offset: 2px; }

  .face {
    position: absolute; inset: 0; display: block;
    padding: 16px 22px 0; color: inherit; text-decoration: none;
    background: var(--c);
    border-radius: 0 6px 0 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    transition: background .3s;
  }
  .face h2 {
    font: 400 clamp(1.9rem, 7vw, 2.6rem)/0.95 var(--hand); margin: 0 0 8px;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .face .meta { font-size: .85rem; margin: 0 0 8px; }
  .face .blurb {
    font-size: .95rem; line-height: 1.5; margin: 0;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card[data-pos="front"] .face:hover h2 { text-decoration: underline solid var(--stitch) 2px; text-underline-offset: 5px; }
  .card:not([data-pos="front"]) .face { pointer-events: none; }

  .card.leaving {
    z-index: 60 !important; opacity: 0;
    transform: translateY(-110px) rotateX(18deg) rotate(-3deg);
    transition: transform .4s ease-in, opacity .35s ease-in, top 0s;
    pointer-events: none;
  }
  .card.arriving { z-index: 60 !important; animation: drop .42s ease-out; }
  @keyframes drop { from { transform: translateY(-110px) rotateX(18deg) rotate(3deg); opacity: 0; } }

  .lip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: 100;
    background: repeating-linear-gradient(90deg, #8a5a34 0 18px, #7d4f2d 18px 19px, #92613a 19px 40px);
    border-radius: 8px 8px 18px 18px;
    box-shadow: 0 14px 22px rgba(0,0,0,.35), inset 0 -10px 0 rgba(0,0,0,.2);
    pointer-events: none;
  }
  .latch {
    position: absolute; left: 50%; top: -4px; width: 48px; height: 30px; transform: translateX(-50%);
    background: var(--brass); border: 2px solid #8f6f22; border-radius: 4px;
  }
  .plate {
    position: absolute; left: 50%; top: 62px; transform: translateX(-50%);
    width: min(260px, 80%); padding: 10px 12px; text-align: center;
    background: var(--brass); border: 3px double var(--brass-dark); border-radius: 6px; color: #3b2a10;
  }
  .plate strong { display: block; font: 400 1.25rem/1.2 var(--display); }
  .plate span { font-size: .8rem; }

  /* ---------- controls ---------- */
  .controls { display: flex; align-items: center; gap: 18px; margin-top: 30px; }
  .controls button {
    font: 1rem var(--type); color: #fff; background: var(--wood-dark);
    border: 0; border-radius: 999px; padding: 11px 22px; cursor: pointer;
    box-shadow: 0 3px 0 #342d23;
  }
  .controls button:hover { background: #665a49; }
  .controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 #342d23; }
  .controls button:focus-visible { outline: 3px solid #1f5fbf; outline-offset: 3px; }
  .count { min-width: 6em; text-align: center; padding: 8px 12px; }
  .add { margin-top: 26px; padding: 10px 20px; color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    .card, .card.leaving, .face { transition: none; }
    .card.arriving { animation: none; }
  }


  /* main navigation */
  .nav {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 6px 10px; padding: 8px 14px; margin: 0 auto 30px; width: fit-content; max-width: 100%;
  }
  .nav a { font: 1rem var(--type); color: var(--ink); text-decoration: none; padding: 8px 18px; border-radius: 999px; }
  .nav a:hover, .nav a[aria-current="page"] { text-decoration: underline solid var(--stitch) 2px; text-underline-offset: 5px; }
  .nav a svg { width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 7px; }
  .nav a.cta { background: var(--wood-dark); color: #fff; box-shadow: 0 3px 0 #342d23; }
  .nav a.cta:hover { background: #665a49; text-decoration: none; }
  @media screen {
    html { background-color: #80563f; background-image: radial-gradient(#fffdf71c 1px, transparent 1px); background-size: 16px 16px; }
    body {
      border-color: transparent;
      border-image: none;
      background:
        radial-gradient(#fffdf71c 1px, transparent 1px) 0 0 / 16px 16px padding-box,
        linear-gradient(#80563f, #80563f) padding-box,
        repeating-conic-gradient(#bc906e 0% 25%, #d6b99b 0% 50%) 50% / 28px 28px border-box;
    }
  }
  @media (max-width: 520px) {
    .nav { gap: 4px; padding: 6px 8px; margin-bottom: 20px; }
    .nav a { padding: 9px 10px; font-size: .95rem; }
    header { margin-bottom: 22px; padding: 14px 16px; }
    header p { font-size: 1rem; line-height: 1.5; }
    .controls { gap: 8px; }
    .controls button { padding: 10px 13px; }
    .plate { padding: 12px; }
    .plate strong { font-size: 1.05rem; }
  }

<nav class="nav patch" aria-label="Main"><a href="/" aria-current="page">Home</a><a href="recipes.html">Recipes</a><a href="map.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</a><a href="submit.html">Add a recipe</a><a href="grandma-submit.html" class="cta">Share a grandma</a></nav>

<header class="patch">
  <h1>Let’s eat grandma</h1>
  <p>Our grandmas’ recipes, kept in one box.</p>
</header>

<section class="tin" id="tin" aria-label="Recipe box">
  <div class="wall"></div>
  <div class="cards" id="cards"></div>
  <div class="lip">
    <div class="latch"></div>
    <div class="plate"><strong>Grandma’s recipes</strong><span>Click a card to open it</span></div>
  </div>
</section>

<div class="controls">
  <button type="button" id="prev">Previous</button>
  <span class="count patch" id="count"></span>
  <button type="button" id="next">Next</button>
</div>
<a class="add patch" href="submit.html">Add a recipe</a>
<p class="sr" id="status" aria-live="polite"></p>

<script>
  // A few sample cards so the box is never empty. Submitted recipes are loaded
  // from the backend (GET /api/recipes) and shown ahead of these samples.
  // Each recipe needs: title, grandma, by, blurb, time, url.
  const SAMPLE_RECIPES = [
    { title: "Sunday Meatballs", grandma: "Nana Rose", by: "Marcus D.", time: "3 hrs",
      blurb: "Soft, tender, and simmered all afternoon in her red sauce.", url: "RecipeExample.html" },
    { title: "Apple Kuchen", grandma: "Oma Greta", by: "Hanna S.", time: "1 hr 15 min",
      blurb: "A buttery yeast cake with apples and a cinnamon crumb.", url: "/recipes/apple-kuchen" },
    { title: "Caramel Pork", grandma: "Bà Ngoại Lan", by: "Kim T.", time: "2 hrs",
      blurb: "Pork belly braised in coconut water until it falls apart.", url: "/recipes/caramel-pork" },
    { title: "Buttermilk Biscuits", grandma: "Granny Mae", by: "Devon R.", time: "35 min",
      blurb: "Tall, flaky, and best eaten hot with too much butter.", url: "/recipes/buttermilk-biscuits" },
    { title: "Arroz con Leche", grandma: "Abuela Luz", by: "Sofia M.", time: "50 min",
      blurb: "Creamy rice pudding with cinnamon sticks and lime peel.", url: "/recipes/arroz-con-leche" },
    { title: "Lemon Chicken", grandma: "Safta Ruth", by: "Eli K.", time: "1 hr 30 min",
      blurb: "Roast chicken over potatoes soaked in lemon and garlic.", url: "/recipes/lemon-chicken" }
  ];

  // Populated once recipes are loaded. `let` because the carousel is (re)built
  // after the backend responds.
  let RECIPES = [];
  let n = 0;
  let cards = [];

  const TAB_X = ['4%', '36%', '66%'];   // tabs sit at three spots, like real index cards
  const stage = document.getElementById('cards');
  const countEl = document.getElementById('count');
  const statusEl = document.getElementById('status');
  let current = 0;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Build the carousel DOM from a list of recipes. Safe to call more than once.
  function buildCards(list) {
    stage.innerHTML = '';
    RECIPES = list;
    n = list.length;
    current = 0;
    cards = list.map((r, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.setProperty('--tabx', TAB_X[i % 3]);
      el.innerHTML =
        `<a class="face" href="${esc(r.url)}">` +
          `<h2>${esc(r.title)}</h2>` +
          `<p class="meta">${esc(r.time)} · sent in by ${esc(r.by)}</p>` +
          `<p class="blurb">${esc(r.blurb)}</p>` +
        `</a>` +
        `<button class="tab" type="button" aria-label="Bring forward ${esc(r.grandma)}’s ${esc(r.title)}">${esc(r.grandma)}</button>`;
      el.querySelector('.tab').addEventListener('click', () => goTo(i));
      stage.appendChild(el);
      return el;
    });
    layout();
  }

  // Load submitted recipes from the backend, newest first, then the samples.
  // If the server isn't reachable, fall back to just the samples.
  async function loadRecipes() {
    let submitted = [];
    try {
      const resp = await fetch('/api/recipes');
      const data = await resp.json();
      if (resp.ok && Array.isArray(data.recipes)) {
        submitted = data.recipes
          .slice()
          .sort((a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0))
          .map(r => ({
            title: r.title || 'Untitled',
            grandma: r.grandma || '',
            by: r.by || '',
            time: r.time || '',
            blurb: r.blurb || '',
            url: r.url || '#'
          }));
      }
    } catch {
      // Server not running / offline — just show the samples below.
    }
    // Drop any sample that now exists in the backend (seeded samples) so each
    // recipe shows only once.
    const haveTitles = new Set(submitted.map(r => r.title.toLowerCase()));
    const samples = SAMPLE_RECIPES.filter(s => !haveTitles.has(s.title.toLowerCase()));
    buildCards([...submitted, ...samples]);
  }

  function layout() {
    cards.forEach((el, i) => {
      const k = (i - current + n) % n;
      const pos = k === 0 ? 'front' : k <= 3 ? 'behind' : 'hidden';
      el.style.setProperty('--k', Math.min(k, 4));
      el.style.zIndex = n - k;
      el.dataset.pos = pos;
      const tab = el.querySelector('.tab'), face = el.querySelector('.face');
      tab.tabIndex = pos === 'behind' ? 0 : -1;
      tab.setAttribute('aria-hidden', pos === 'behind' ? 'false' : 'true');
      face.tabIndex = pos === 'front' ? 0 : -1;
      face.setAttribute('aria-hidden', pos === 'front' ? 'false' : 'true');
    });
    countEl.textContent = `${current + 1} of ${n}`;
    const r = RECIPES[current];
    statusEl.textContent = `${r.title} by ${r.grandma}, recipe ${current + 1} of ${n}`;
  }

  function goTo(next, backwards = false) {
    if (next === current) return;
    const old = cards[current];
    current = next;
    layout();
    if (backwards) {
      const el = cards[current];
      el.classList.add('arriving');
      setTimeout(() => el.classList.remove('arriving'), 450);
    } else {
      old.classList.add('leaving');
      setTimeout(() => old.classList.remove('leaving'), 420);
    }
  }
  const next = () => goTo((current + 1) % n);
  const prev = () => goTo((current - 1 + n) % n, true);

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // Swipe left/right on the box
  const tin = document.getElementById('tin');
  let startX = null, swiped = false;
  tin.addEventListener('pointerdown', e => { startX = e.clientX; swiped = false; });
  tin.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) { swiped = true; dx < 0 ? next() : prev(); }
  });
  tin.addEventListener('click', e => { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false; } }, true);

  // Kick things off: fetch submitted recipes, then build the box.
  loadRecipes();
</script>
</body>
</html>
